    --good:#4FB9C9; --good-soft:#123138; --good-line:#1F5560;
    --warn:#F0BE78; --warn-soft:#3A2C10; --warn-line:#6B4E16;
    --bad:#E58676; --bad-soft:#3A1B15; --bad-line:#6E3226;
    --shadow-card:0 1px 2px rgba(0,0,0,.4); --shadow-pop:0 12px 32px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); }
  a{ color:var(--accent); }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:300; letter-spacing:-.005em; text-wrap:balance; margin:0; color:var(--ink); }
  h1 b,h2 b,h3 b,h4 b{ font-weight:700; color:var(--accent); }
  .ic{ display:inline-block; vertical-align:-3px; width:16px; height:16px; fill:currentColor; flex:none; }
  .ic-lg{ width:20px; height:20px; vertical-align:-4px; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  button, input, select, textarea{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  input,select,textarea{
    background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-s);
    padding:8px 10px; width:100%; color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
  .field{ display:flex; flex-direction:column; gap:2px; }
  .field-note{ font-size:12px; color:var(--ink-faint); margin-top:2px; }

  /* app shell */
  #app{ min-height:100%; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:10px 20px; padding-top:calc(10px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-right:auto; }
  .brand-logo{ display:flex; align-items:center; height:26px; flex:none; }
  .brand-logo svg{ height:100%; width:auto; display:block; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-family:var(--font-display); font-size:15.5px; font-weight:400; }
  .brand-text span{ font-size:11px; color:var(--ink-muted); letter-spacing:.03em; text-transform:uppercase; }
  nav.tabs{ display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; }
  nav.tabs button{
    border:none; background:transparent; padding:7px 14px; border-radius:7px; font-weight:600; font-size:13.5px; color:var(--ink-muted);
  }
  nav.tabs button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-card); }
  .whoami{ display:flex; align-items:center; gap:8px; }
  .whoami input{ width:150px; padding:7px 10px; font-size:13.5px; }
  .whoami label{ margin:0; }
  .hub-back{ font-size:13px; font-weight:600; color:var(--ink-muted); border:1px solid var(--line-strong);
    padding:7px 14px; border-radius:var(--radius-s); text-decoration:none; white-space:nowrap; }
  .hub-back:hover{ color:var(--accent); border-color:var(--accent); }

  main{ flex:1; width:100%; max-width:1180px; margin:0 auto; padding:24px 20px 64px; }
  @media (max-width:720px){ main{ padding:16px 14px 48px; } .topbar{ padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px)); } }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .page-head h1{ font-size:26px; }
  .page-head p{ margin:4px 0 0; color:var(--ink-muted); font-size:14px; max-width:60ch; }

  .btn{
    display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line-strong); background:var(--surface);
    padding:9px 15px; border-radius:var(--radius-s); font-weight:600; font-size:13.5px; color:var(--ink);
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-ghost{ border-color:transparent; background:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ color:var(--bad); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-sm{ padding:5px 10px; font-size:12.5px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow-card); }
  .card-pad{ padding:20px; }
  .section-title{ font-family:var(--font-display); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin:0 0 14px; display:flex; align-items:center; gap:8px; }
  .grid{ display:grid; gap:14px; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:1fr 1fr 1fr; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  @media (max-width:760px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } }

  /* badges / pills */
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em; border:1px solid transparent; }
  .pill-go{ background:var(--good-soft); color:var(--good); border-color:var(--good-line); }
  .pill-caution{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line); }
  .pill-nogo{ background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line); }
  .pill-neutral{ background:var(--surface-2); color:var(--ink-muted); border-color:var(--line); }
  .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }

  /* quote list */
  .quote-row{
    display:grid; grid-template-columns:1.4fr 1fr .8fr .9fr .7fr auto; gap:14px; align-items:center;
    padding:14px 18px; border-bottom:1px solid var(--line); text-decoration:none; color:inherit;
  }
  .quote-row:last-child{ border-bottom:none; }
  .quote-row:hover{ background:var(--surface-2); cursor:pointer; }
  .quote-row .refs b{ font-family:var(--font-mono); font-size:13.5px; }
  .quote-row .refs div{ font-size:12px; color:var(--ink-muted); margin-top:2px; }
  .quote-row .money{ font-family:var(--font-mono); font-weight:600; text-align:right; }
  @media (max-width:760px){ .quote-row{ grid-template-columns:1fr; gap:6px; } .quote-row .money{ text-align:left; } }

  .empty{ text-align:center; padding:60px 20px; color:var(--ink-muted); }
  .empty h3{ color:var(--ink); margin-bottom:6px; }

  /* cargo piece card */
  .piece{ border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; background:var(--surface-2); margin-bottom:12px; }
  .piece-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .piece-head b{ font-family:var(--font-display); font-size:14px; }
  .reasons{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:5px; }
  .reasons li{ font-size:12.5px; padding-left:16px; position:relative; color:var(--ink-muted); }
  .reasons li::before{ content:'\2013'; position:absolute; left:0; }
  .reasons li.r-bad{ color:var(--bad); }
  .reasons li.r-warn{ color:var(--warn); }

  .checkline{ display:flex; align-items:center; gap:8px; font-size:13.5px; }
  .checkline input[type=checkbox]{ width:16px; height:16px; }

  table.rate-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.rate-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); padding:6px 8px; border-bottom:1px solid var(--line-strong); }
  table.rate-table td{ padding:6px 8px; border-bottom:1px solid var(--line); }
  table.rate-table td input{ padding:5px 7px; font-size:13px; }
  .wrap-table{ overflow-x:auto; }

  .flag{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--warn); background:var(--warn-soft); border:1px solid var(--warn-line); padding:2px 7px; border-radius:99px; white-space:nowrap; }

  .banner{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:var(--radius-m); border:1px solid; margin-bottom:18px; font-size:13.5px; }
  .banner-warn{ background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn); }
  .banner-good{ background:var(--good-soft); border-color:var(--good-line); color:var(--good); }
  .banner b{ display:block; margin-bottom:2px; color:var(--ink); font-family:var(--font-body); }

  .tabstrip{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .tabstrip button{ border:none; background:none; padding:10px 4px; margin-right:22px; font-weight:600; color:var(--ink-muted); border-bottom:2px solid transparent; font-size:14px; }
  .tabstrip button.active{ color:var(--ink); border-color:var(--accent); }

  textarea.paste-box{ min-height:130px; font-family:var(--font-mono); font-size:12.5px; resize:vertical; }
  .dropzone{ border:1.5px dashed var(--line-strong); border-radius:var(--radius-m); padding:18px; text-align:center; color:var(--ink-muted); font-size:13px; }
  .dropzone.drag{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }

  .sticky-side{ position:sticky; top:calc(76px + env(safe-area-inset-top,0px)); }
  .quote-layout{ display:grid; grid-template-columns:1fr 340px; gap:22px; align-items:start; }
  @media (max-width:960px){ .quote-layout{ grid-template-columns:1fr; } .sticky-side{ position:static; } }

  .totalline{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .totalline.grand{ border-bottom:none; border-top:1px solid var(--line-strong); margin-top:6px; padding-top:10px; font-size:16px; font-weight:700; font-family:var(--font-mono); }

  .example-badge{ background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:5px; }

  .footer-note{ margin-top:40px; font-size:12px; color:var(--ink-faint); text-align:center; }
  [hidden]{ display:none !important; }

  /* ── ENTRA ID AUTH GATE — see index.html for the full explanation ── */
  .auth-gate{position:fixed;inset:0;z-index:9999;background:#3C3C46;display:flex;align-items:center;justify-content:center;padding:1.5rem;transition:opacity .25s ease}
  .auth-gate.done{opacity:0;pointer-events:none}
  .auth-gate-inner{text-align:center;font-family:inherit}
  .auth-gate-spinner{width:34px;height:34px;margin:0 auto 1.25rem;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#FF6441;animation:auth-spin .8s linear infinite}
  .auth-gate.denied .auth-gate-spinner{display:none}
  @keyframes auth-spin{to{transform:rotate(360deg)}}
  #auth-gate-text{font-size:13px;color:#AAB4C3;max-width:320px;line-height:1.5}
  .sign-out-btn{margin-left:8px;padding:6px 12px;border-radius:6px;border:1px solid var(--line-strong,rgba(0,0,0,.15));background:transparent;color:inherit;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .sign-out-btn:hover{border-color:#FF6441;color:#FF6441}
</style>

<script>
(function () {
  const msalConfig = {
    auth: {
      clientId: '632f5684-1d22-452b-8eb0-8662eee53e1f',
      authority: 'https://login.microsoftonline.com/05d75c05-fa1a-42e7-9cf1-eb416c396f2d',
      redirectUri: 'https://strategy-team-al.github.io/smarthub/',
      postLogoutRedirectUri: 'https://strategy-team-al.github.io/smarthub/',
    },
    cache: { cacheLocation: 'localStorage' },
  };
  const msalInstance = new msal.PublicClientApplication(msalConfig);
  const authGate = document.getElementById('auth-gate');
  const authGateText = document.getElementById('auth-gate-text');

  function grantAccess() {
    authGate.classList.add('done');
    const backLink = document.querySelector('a.hub-back');
    if (backLink && !backLink.nextElementSibling?.classList.contains('sign-out-btn')) {
      const signOut = document.createElement('button');
      signOut.type = 'button';
      signOut.className = 'sign-out-btn';
      signOut.textContent = 'Sign out';
      signOut.onclick = () => msalInstance.logoutRedirect();
      backLink.insertAdjacentElement('afterend', signOut);
    }
  }

  (async () => {
    try {
      await msalInstance.initialize();
      const account = msalInstance.getAllAccounts()[0];
      if (!account) {
        authGateText.textContent = 'Redirecting to Microsoft sign-in…';
        window.location.href = '../../../index.html?returnTo=' + encodeURIComponent(window.location.href);
        return;
      }
      msalInstance.setActiveAccount(account);
      grantAccess();
    } catch (err) {
      console.error('[Auth]', err);
      authGate.classList.add('denied');
      authGateText.textContent = 'Access denied. This tool is restricted to APM Terminals Mobile staff.';
    }
  })();
})();

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------------
   CONSTANTS / REFERENCE DEFAULTS
   Every number below is sourced from documents Christian Baugh (APM
   Terminals Mobile) provided, cited in the "source" field. Anything
   marked confirmed:false showed a discrepancy across source documents
   and defaults to the most defensible value pending his confirmation
   in the Reference & Rates screen.
--------------------------------------------------------------------- */
const LBS_PER_MT = 2204.62;      // metric tonne
const LBS_PER_USTON = 2000;      // US short ton
const CARRIERS = ["TARIFF","ZIM","EVG","MSK","MSC","CMA","COSCO"];
const CARRIER_LABELS = { TARIFF:"Tariff (published)", ZIM:"ZIM", EVG:"Evergreen", MSK:"Maersk", MSC:"MSC", CMA:"CMA CGM", COSCO:"COSCO" };

function defaultConfig(){
  return {
    rates: {
      TARIFF: { st:4938.69, ot:6025.98, extraLaborSt:114.50, extraLaborOt:156.90, confirmed:true,
        note:"Universal tariff — applies to every quote regardless of carrier, per Christian's latest tariff sheet." }
    },
    fees: {
      survey: { amount:1000, confirmed:false, note:"The live calculator resolves SURVEY to $1,000 (Sheet2!E32), but the quote's own boilerplate text tells customers $500, and the terminal tariff lists a $381.69 cargo inspection fee. Pick the real number." },
      reHandle: { amount:750, confirmed:false, note:"The live calculator's RE-HANDLE lookup cell is currently blank and resolves to $0 (Sheet2!E33) — almost certainly an oversight. A separate reference table on the same sheet (AD43) lists $750, used here as the default." },
      notDirectDischarge: { amount:0, confirmed:false, note:"Your quote boilerplate warns of an extra charge \"if not direct discharge\" but no fee exists anywhere in the calculator. Set the real surcharge amount, or leave at $0 and rely on a manual note." }
    },
    capability: {
      craneHookMt: 100, craneSpreaderTwinMt: 65, craneSpreaderSingleMt: 51,
      beam110UsTon: 110, beam60UsTon: 60, shackleTonne: 75,
      slingVerticalLbs: 40000, slingBasketLbs: 80000,
      maxLengthAthwartshipFt: 55, maxLengthAlongLegsFt: 45, ohBarHeightThresholdFt: 6,
      tandemAllowed: false, capabilityConfirmed:false,
      capabilityNote:"Crane hook (100 MT) and spreader (65 MT twin / 51 MT single) ratings are cross-confirmed by both ZPMC crane general-arrangement drawings and the Sep-2020 CMA CGM Lifting Capabilities Questionnaire. The 45'/55' length limits and the 6' overhead-bar/chain threshold come only from that 2020 questionnaire — please confirm they're still current. Rigging chain (headblock hook → twin-path slings, basketed → 110-ton or 60-ton spreader beam → 4x 20' straps to cargo) is per Christian's description; the tool checks cargo weight/dimensions against the beam and hook ratings directly rather than modeling sling-angle geometry."
    }
  };
}

function craneCap(cfg){ return cfg.capability.craneHookMt * LBS_PER_MT; }
function beam110Cap(cfg){ return Math.min(cfg.capability.beam110UsTon*LBS_PER_USTON, craneCap(cfg)); }
function beam60Cap(cfg){ return Math.min(cfg.capability.beam60UsTon*LBS_PER_USTON, craneCap(cfg)); }

/* ---------------------------------------------------------------------
   FEASIBILITY ENGINE
--------------------------------------------------------------------- */
function computePieceFeasibility(piece, cfg){
  const reasons = [];
  let status = "go";
  const weight = Number(piece.weightLbs)||0;
  const length = Number(piece.lengthFt)||0;
  const height = Number(piece.heightFt)||0;
  const cap60 = beam60Cap(cfg), cap110 = beam110Cap(cfg);

  let rig = "";
  if (weight <= 0){
    reasons.push({level:"warn", text:"Enter a cargo weight to check capacity."});
    status = "caution";
  } else if (weight <= cap60){
    rig = "60-ton spreader beam + crane hook (" + fmtLbs(cap60) + " capacity)";
  } else if (weight <= cap110){
    rig = "110-ton spreader beam + crane hook (" + fmtLbs(cap110) + " capacity)";
  } else {
    status = "nogo";
    reasons.push({level:"bad", text:"Exceeds the heaviest rigging combination on hand — 110-ton beam / " + cfg.capability.craneHookMt + " MT crane hook (" + fmtLbs(cap110) + "). Tandem (2-crane) lifts are not offered at this terminal."});
  }
  if (rig) reasons.push({level:"info", text:"Suggested rig: " + rig + "."});

  const isAthwart = /athwart/i.test(piece.stowagePosition||"");
  const lengthLimit = isAthwart ? cfg.capability.maxLengthAthwartshipFt : cfg.capability.maxLengthAlongLegsFt;
  if (length > 0 && length > lengthLimit){
    if (status === "go") status = "caution";
    reasons.push({level:"warn", text:"Length " + length + "' exceeds the " + lengthLimit + "' reference limit for " + (isAthwart?"athwartship":"along-vessel-leg") + " stowage — confirm crane reach/back-reach before quoting."});
  }
  if (height > 0 && height > cfg.capability.ohBarHeightThresholdFt){
    reasons.push({level:"info", text:"Cargo is over " + cfg.capability.ohBarHeightThresholdFt + "' tall — rig with chains rather than an overhead bar."});
  }
  if (piece.hazardous === "Yes"){
    if (status === "go") status = "caution";
    reasons.push({level:"warn", text:"Hazardous cargo — confirm class, Terminal Managing Director acceptance (Class 1), and surveyor requirement before quoting."});
  }
  if (!piece.description && !piece.weightLbs){
    status = "caution";
  }
  return { status, reasons };
}

function overallStatus(pieces){
  if (!pieces.length) return "caution";
  if (pieces.some(p=>p.feas.status==="nogo")) return "nogo";
  if (pieces.some(p=>p.feas.status==="caution")) return "caution";
  return "go";
}

/* ---------------------------------------------------------------------
   PRICING ENGINE (ported from BBK CALCULATOR 2026.xlsx Sheet1)
--------------------------------------------------------------------- */
function computePricing(quote, cfg){
  const rate = cfg.rates.TARIFF; // one universal tariff applies to every carrier
  const p = quote.pricing;
  const stHours = Number(p.stHours)||0, otHours = Number(p.otHours)||0;
  const elStHours = Number(p.extraLaborStHours)||0, elOtHours = Number(p.extraLaborOtHours)||0;
  const items = [];
  items.push({label:"Tariff / carrier rate — straight time", hours:stHours, rate:rate.st, amount: stHours*rate.st, bucket:"st"});
  items.push({label:"Tariff / carrier rate — overtime", hours:otHours, rate:rate.ot, amount: otHours*rate.ot, bucket:"ot"});
  if (elStHours>0) items.push({label:"Extra labor — straight time", hours:elStHours, rate:rate.extraLaborSt, amount: elStHours*rate.extraLaborSt, bucket:"st"});
  if (elOtHours>0) items.push({label:"Extra labor — overtime", hours:elOtHours, rate:rate.extraLaborOt, amount: elOtHours*rate.extraLaborOt, bucket:"ot"});
  if (p.surveyNeeded) items.push({label:"Surveyor fee", hours:null, rate:null, amount: cfg.fees.survey.amount, bucket:"both"});
  if (p.reHandleNeeded) items.push({label:"Re-handle fee", hours:null, rate:null, amount: cfg.fees.reHandle.amount, bucket:"both"});
  if (p.notDirectDischarge) items.push({label:"Not direct discharge surcharge", hours:null, rate:null, amount: cfg.fees.notDirectDischarge.amount, bucket:"both"});

  let stTotal=0, otTotal=0;
  items.forEach(it=>{
    if (it.bucket==="st") stTotal += it.amount;
    else if (it.bucket==="ot") otTotal += it.amount;
    else { stTotal += it.amount; otTotal += it.amount; }
  });
  return { items, stTotal, otTotal };
}

/* ---------------------------------------------------------------------
   EMAIL PARSER
--------------------------------------------------------------------- */
const FIELD_LABELS = {
  "marine ops ref": "marineOpsRef", "commercial ref": "commercialRef",
  "cargo type": "cargoType", "import/export": "importExport",
  "pol": "pol", "pod": "pod", "terminal": "terminal", "service": "vesselService",
  "stevedore": "stevedore"
};
const PIECE_LABELS = {
  "cargo description": "description", "lifting method": "liftingMethod",
  "pictures/drawings": "picturesDrawings", "hazardous": "hazardous",
  "stowage position": "stowagePosition", "flat rack count": "flatRackCount",
  "additional info": "additionalInfo", "cargo weight": "weightRaw",
  "cargo dimensions": "dimsRaw"
};
function detectCarrierFromText(text){
  const t = text.toLowerCase();
  if (/@msc\.com|mediterranean shipping/.test(t)) return "MSC";
  if (/@maersk\.com|\bmsk\b/.test(t)) return "MSK";
  if (/@zim\.com|\bzim\b/.test(t)) return "ZIM";
  if (/@cma-cgm\.com|cma cgm/.test(t)) return "CMA";
  if (/evergreen|@evergreen-marine/.test(t)) return "EVG";
  if (/cosco/.test(t)) return "COSCO";
  return "TARIFF";
}
function parseDims(raw){
  const out = {};
  if (!raw) return out;
  const m = raw.match(/([\d.]+)\s*ft\s*x\s*([\d.]+)\s*ft\s*x\s*([\d.]+)\s*ft/i);
  if (m){ out.lengthFt = m[1]; out.widthFt = m[2]; out.heightFt = m[3]; }
  const w = raw.match(/@\s*([\d,]+)\s*lbs/i);
  if (w) out.weightLbs = w[1].replace(/,/g,"");
  return out;
}
function parseWeight(raw){
  if (!raw) return "";
  const m = raw.match(/([\d,]+)\s*lbs/i);
  return m ? m[1].replace(/,/g,"") : raw.replace(/[^\d.]/g,"");
}
function cellLabel(text){ return (text||"").replace(/[:#]/g,"").trim().toLowerCase(); }
// Email table labels aren't always the exact dictionary key -- e.g. the real
// quote-request template uses "Cargo Dimensions (L x W x H)" where our
// dictionary key is "cargo dimensions". Try an exact match first, then fall
// back to "label starts with key" so trailing qualifiers like "(L x W x H)"
// or "(approx)" don't break the match.
function matchLabelKey(label, dict){
  if (Object.prototype.hasOwnProperty.call(dict, label)) return label;
  for (const key in dict){
    if (label.indexOf(key) === 0) return key;
  }
  return null;
}

function parseEmailText(raw){
  const result = { header:{}, pieces:[], carrier: detectCarrierFromText(raw) };
  let rows = [];
  if (/<table/i.test(raw) || /<html/i.test(raw)){
    try{
      const doc = new DOMParser().parseFromString(raw, "text/html");
      doc.querySelectorAll("tr").forEach(tr=>{
        const cells = Array.from(tr.querySelectorAll("td,th")).map(td=>td.textContent.replace(/\s+/g," ").trim());
        if (cells.length) rows.push(cells);
      });
    }catch(e){ /* fall through to plain text */ }
  }
  if (!rows.length){
    raw.split(/\r?\n/).forEach(line=>{
      const m = line.match(/^\s*([A-Za-z][A-Za-z0-9 \/#()\-]{2,40}?)\s*[:\-]\s*(.+)$/);
      if (m) rows.push([m[1], m[2]]);
    });
  }
  let currentPiece = null;
  rows.forEach(cells=>{
    if (cells.length < 2) return;
    const label = cellLabel(cells[0]);
    const value = (cells[1]||"").trim();
    if (!label || !value) return;
    if (/^cargo\s*#\s*\d+/i.test(cells[0])){
      currentPiece = { description:"", liftingMethod:"", picturesDrawings:"", hazardous:"", stowagePosition:"", flatRackCount:"", additionalInfo:"", weightLbs:"", lengthFt:"", widthFt:"", heightFt:"" };
      result.pieces.push(currentPiece);
      return;
    }
    const fieldKey = matchLabelKey(label, FIELD_LABELS);
    if (fieldKey){ result.header[FIELD_LABELS[fieldKey]] = value; return; }
    const pieceKey = matchLabelKey(label, PIECE_LABELS);
    if (pieceKey){
      if (!currentPiece){ currentPiece = { description:"", liftingMethod:"", picturesDrawings:"", hazardous:"", stowagePosition:"", flatRackCount:"", additionalInfo:"", weightLbs:"", lengthFt:"", widthFt:"", heightFt:"" }; result.pieces.push(currentPiece); }
      const field = PIECE_LABELS[pieceKey];
      if (field === "weightRaw") currentPiece.weightLbs = parseWeight(value);
      else if (field === "dimsRaw") Object.assign(currentPiece, parseDims(value));
      else currentPiece[field] = value;
      return;
    }
  });
  if (!result.pieces.length && result.header.cargoType){
    result.pieces.push({ description: result.header.cargoType, liftingMethod:"", picturesDrawings:"", hazardous:"", stowagePosition:"", flatRackCount:"", additionalInfo:"", weightLbs:"", lengthFt:"", widthFt:"", heightFt:"" });
  }
  return result;
}
// Best-effort raw .msg (OLE binary) text recovery. No OLE parsing library
// is loaded (to keep this a single dependency-free file), so this reads
// the raw bytes directly instead:
// Outlook stores the HTML body (PR_HTML) as single-byte Windows-1252 text
// and the plain-text body (PR_BODY) as UTF-16LE — try the HTML landmark
// first since quote-request emails are HTML tables, then fall back to a
// UTF-16LE scan for plain-text bodies. The parsed draft is always shown
// for review before saving, never auto-saved.
function extractTextFromMsgBuffer(buf){
  const bytes = new Uint8Array(buf);
  let latin1 = "";
  for (let i=0;i<bytes.length;i++) latin1 += String.fromCharCode(bytes[i]);
  const htmlIdx = latin1.search(/<html[\s>]/i);
  if (htmlIdx >= 0){
    let end = latin1.toLowerCase().indexOf("</html>", htmlIdx);
    end = end >= 0 ? end + 7 : Math.min(latin1.length, htmlIdx + 200000);
    return latin1.slice(htmlIdx, end);
  }
  let best = "", cur = [];
  for (let i=0; i+1<bytes.length; i+=2){
    const code = bytes[i] | (bytes[i+1]<<8);
    if (code >= 32 && code < 55296){ cur.push(String.fromCharCode(code)); }
    else {
      if (cur.length > best.length) best = cur.join("");
      cur = [];
    }
  }
  if (cur.length > best.length) best = cur.join("");
  return best;
}

/* ---------------------------------------------------------------------
   APP STATE
   This app is fully self-contained: it runs as a standalone HTML file,
   with no server and no external account. Quotes and reference data are
   saved to this browser's local storage only. Because there is no shared
   backend, teams share data with Export / Import (a plain .json file) --
   e.g. saved to a shared drive, or emailed between AOMs.
--------------------------------------------------------------------- */
const STORAGE_KEY_CONFIG = "bbk_config";
const STORAGE_KEY_QUOTES = "bbk_quotes";
let config = defaultConfig();
let quotes = [];
let quotesLoaded = false;
let draft = null;      // in-progress quote object while on #/quotes/new or #/quotes/:id
let draftId = null;    // existing quote id being edited, or null for new

function deepMerge(base, extra){
  if (!extra || typeof extra !== "object") return base;
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  Object.keys(extra).forEach(k=>{
    if (extra[k] && typeof extra[k] === "object" && !Array.isArray(extra[k]) && base[k] && typeof base[k]==="object"){
      out[k] = deepMerge(base[k], extra[k]);
    } else out[k] = extra[k];
  });
  return out;
}

function loadState(){
  try{
    const rawCfg = localStorage.getItem(STORAGE_KEY_CONFIG);
    if (rawCfg) config = deepMerge(defaultConfig(), JSON.parse(rawCfg));
  }catch(e){ /* keep defaults */ }
  try{
    const rawQuotes = localStorage.getItem(STORAGE_KEY_QUOTES);
    if (rawQuotes){
      quotes = JSON.parse(rawQuotes) || [];
    } else {
      // first-ever run in this browser: seed the example quote
      quotes = [exampleQuote()];
      quotes[0].id = "example-local";
    }
  }catch(e){
    quotes = [exampleQuote()];
    quotes[0].id = "example-local";
  }
  quotesLoaded = true;
}

function persistQuotes(){
  try{ localStorage.setItem(STORAGE_KEY_QUOTES, JSON.stringify(quotes)); }catch(e){ /* storage full or unavailable */ }
}

function boot(){
  const whoInput = document.getElementById("whoamiInput");
  whoInput.value = whoami();
  whoInput.addEventListener("change", ()=> setWhoami(whoInput.value.trim()));

  document.getElementById("mainNav").addEventListener("click", (e)=>{
    const btn = e.target.closest("button[data-route]");

  });

async function saveQuote(q){
  q.updatedAt = todayIso();
  if (draftId){
    const i = quotes.findIndex(x=>x.id===draftId);
    if (i>=0) quotes[i] = Object.assign({id:draftId}, q);
    else quotes.unshift(Object.assign({id:draftId}, q));
  } else {
    draftId = "q-"+uid();
    quotes.unshift(Object.assign({id:draftId}, q));
  }
  persistQuotes();
}

/* ---------------------------------------------------------------------
   EXPORT / IMPORT (team-sharing without a shared backend)
--------------------------------------------------------------------- */
async function exportData(){
  const payload = { exportedAt: todayIso(), app:"Breakbulk Quote Desk", config, quotes };
  const json = JSON.stringify(payload, null, 2);
  const filename = "bbk-quotes-export-" + todayIso().slice(0,10) + ".json";

  // When this page is opened via a hosted link, the browser's own
  // download mechanism is sandboxed, so a real save has to go through
  // the platform's own "downloads" capability instead. When this page
  // is opened as a plain, standalone file (double-clicked, no hosting
  // involved), window.claude does not exist and the ordinary browser
  // download below runs directly -- no dependency on any of this.
  if (window.claude && window.claude.use){
    try{
      const downloads = await window.claude.use("downloads");
      if (downloads){
        await downloads.save({ filename, data: json });
        return;
      }
    }catch(e){ /* declined, unavailable, etc. -- fall through */ }
  }

  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}
function importDataFromFile(file){
  const reader = new FileReader();
  reader.onerror = ()=> alert("Couldn't read that file.");
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ alert("Couldn't read that file — make sure it's a Breakbulk Quote Desk export (.json)."); return; }
    let added = 0, updated = 0;
    (data.quotes||[]).forEach(q=>{
      if (!q || !q.id) return;
      const i = quotes.findIndex(x=>x.id===q.id);
      if (i>=0){ quotes[i] = q; updated++; } else { quotes.push(q); added++; }
    });
    persistQuotes();
    let configNote = "";
    if (data.config && confirm("This file also includes Reference & Rates numbers. Import them too? This will overwrite your current rates, fees, and crane/rigging settings.")){
      config = deepMerge(defaultConfig(), data.config);
      saveConfig();
      configNote = " Reference & Rates were updated too.";
    }
    alert("Imported " + added + " new quote" + (added===1?"":"s") + " and updated " + updated + "." + configNote);
    route();
  };
  reader.readAsText(file);
}

function route(){
  const hash = location.hash || "#/quotes";
  document.querySelectorAll("#mainNav button").forEach(b=>{
    b.classList.toggle("active", hash.indexOf(b.getAttribute("data-route"))===0 && (b.getAttribute("data-route")!=="#/quotes" || hash==="#/quotes" || hash==="" ));
  });
  document.querySelectorAll("#mainNav button").forEach(b=>{
    const r = b.getAttribute("data-route");
    let active = false;
    if (r === "#/quotes") active = (hash === "#/quotes" || (hash.indexOf("#/quotes/") === 0 && hash !== "#/quotes/new"));
    else active = hash.indexOf(r) === 0;
    b.classList.toggle("active", active);
  });
  if (hash === "#/quotes" || hash === "") renderQuoteList();
  else if (hash === "#/quotes/new") { draft = blankQuote(); draftId = null; renderQuoteForm(); }
  else if (hash.indexOf("#/quotes/") === 0){
    const id = hash.slice("#/quotes/".length);
    const existing = quotes.find(q=>q.id===id);
    if (existing){ draft = JSON.parse(JSON.stringify(existing)); draftId = id; renderQuoteForm(); }
    else { location.hash = "#/quotes"; }
  }
  else if (hash === "#/settings") renderSettings();
  else renderQuoteList();
}

  wrap.innerHTML = draft.pieces.map((p,idx)=>{
    return `<div class="piece" data-idx="${idx}">
      <div class="piece-head"><b>Cargo #${idx+1}</b>${draft.pieces.length>1?'<button class="btn btn-sm btn-ghost btn-danger removePieceBtn" data-idx="'+idx+'">Remove</button>':''}</div>
      <div class="grid grid-3">
        <div class="field" style="grid-column:span 2;"><label>Description</label><input class="pf" data-field="description" data-idx="${idx}" value="${esc(p.description)}"></div>
        <div class="field"><label>Lifting method</label><input class="pf" data-field="liftingMethod" data-idx="${idx}" value="${esc(p.liftingMethod)}" placeholder="Lugs, chains, top lift&hellip;"></div>
        <div class="field"><label>Weight (lbs)</label><input class="pf" data-field="weightLbs" data-idx="${idx}" type="number" value="${esc(p.weightLbs)}"></div>
        <div class="field"><label>Length (ft)</label><input class="pf" data-field="lengthFt" data-idx="${idx}" type="number" value="${esc(p.lengthFt)}"></div>
        <div class="field"><label>Width (ft)</label><input class="pf" data-field="widthFt" data-idx="${idx}" type="number" value="${esc(p.widthFt)}"></div>
        <div class="field"><label>Height (ft)</label><input class="pf" data-field="heightFt" data-idx="${idx}" type="number" value="${esc(p.heightFt)}"></div>
        <div class="field"><label>Stowage position</label>
          <select class="pf" data-field="stowagePosition" data-idx="${idx}">
            <option value="">—</option>
            <option ${p.stowagePosition==="Athwartship"?"selected":""}>Athwartship</option>
            <option ${p.stowagePosition==="Alongship"?"selected":""}>Alongship</option>
            <option ${p.stowagePosition==="Fore-Aft"?"selected":""}>Fore-Aft</option>
          </select>
        </div>
        <div class="field"><label>Hazardous</label>
          <select class="pf" data-field="hazardous" data-idx="${idx}"><option ${p.hazardous==="No"?"selected":""}>No</option><option ${p.hazardous==="Yes"?"selected":""}>Yes</option></select>
        </div>
        <div class="field"><label>Pictures/drawings</label><input class="pf" data-field="picturesDrawings" data-idx="${idx}" value="${esc(p.picturesDrawings)}" placeholder="Yes / No"></div>
        <div class="field"><label>Flat rack count</label><input class="pf" data-field="flatRackCount" data-idx="${idx}" value="${esc(p.flatRackCount)}"></div>
        <div class="field" style="grid-column:span 3;"><label>Additional info</label><input class="pf" data-field="additionalInfo" data-idx="${idx}" value="${esc(p.additionalInfo)}"></div>
      </div>
      <div class="piece-feas" data-idx="${idx}"></div>
    </div>`;
  }).join("");

  wrap.querySelectorAll(".pf").forEach(el=>{
    el.addEventListener("input", (e)=>{
      const idx = +e.target.getAttribute("data-idx"), field = e.target.getAttribute("data-field");
      draft.pieces[idx][field] = e.target.value;
      paintPieceFeas(idx);
      paintFeasSummaryHeader();
    });
  });
  wrap.querySelectorAll(".removePieceBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = +btn.getAttribute("data-idx");
      draft.pieces.splice(idx,1);
      renderPieces();
      paintDerived();
    });
  });
  draft.pieces.forEach((_,idx)=>paintPieceFeas(idx));
}

function paintPieceFeas(idx){
  const el = document.querySelector('.piece-feas[data-idx="'+idx+'"]');
  if (!el) return;
  const p = draft.pieces[idx];
  const feas = computePieceFeasibility(p, config);
  el.innerHTML = statusPill(feas.status) + '<ul class="reasons">' + feas.reasons.map(r=>'<li class="r-'+(r.level==="info"?"":r.level)+'">'+esc(r.text)+'</li>').join("") + '</ul>';
}

function paintFeasSummaryHeader(){
  const panel = document.getElementById("feasPanel");
  if (!panel) return;
  const pieces = draft.pieces.map(p=>Object.assign({}, p, {feas: computePieceFeasibility(p, config)}));
  const overall = overallStatus(pieces);
  const label = overall==="go" ? "This lift looks feasible against your current crane and rigging ratings."
    : overall==="nogo" ? "At least one piece exceeds every rigging combination on hand — do not quote as-is."
    : "Feasible with caveats — review the flagged items before quoting.";
  panel.innerHTML = '<div class="section-title">'+icon('crane')+' Feasibility</div>'
    + '<div style="margin-bottom:10px;">'+statusPill(overall)+'</div>'
    + '<p style="font-size:13.5px; color:var(--ink-muted); margin:0 0 14px;">'+label+'</p>'
    + pieces.map((p,i)=>'<div style="margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--line);"><b style="font-size:12.5px;">Cargo #'+(i+1)+(p.description?": "+esc(p.description):"")+'</b><div style="margin-top:4px;">'+statusPill(p.feas.status)+'</div></div>').join("");
}

function paintPricingPanel(){
  const panel = document.getElementById("pricePanel");
  if (!panel) return;
  const pr = computePricing(draft, config);
  const rate = config.rates.TARIFF;
  panel.innerHTML = '<div class="section-title">'+icon('calculator')+' Pricing — Tariff</div>'
    + pr.items.map(it=>'<div class="totalline"><span>'+esc(it.label)+(it.hours!=null?' ('+it.hours+'h @ '+fmtMoney(it.rate)+')':'')+'</span><span class="mono">'+fmtMoney(it.amount)+'</span></div>').join("")
    + '<div class="totalline grand"><span>Straight-time total</span><span>'+fmtMoney(pr.stTotal)+'</span></div>'
    + '<div class="totalline grand"><span>Overtime total</span><span>'+fmtMoney(pr.otTotal)+'</span></div>'
    + (rate.confirmed===false ? '<div class="flag" style="margin-top:12px;">⚠ Tariff rate unconfirmed — see Reference &amp; Rates</div>' : '');
}

function paintDerived(){ paintFeasSummaryHeader(); paintPricingPanel(); }

function wireFormEvents(){
  document.getElementById("saveBtn").addEventListener("click", async ()=>{
    collectHeaderFields();
    delete draft.isExample;
    const btn = document.getElementById("saveBtn");
    btn.disabled = true; btn.textContent = "Saving…";
    await saveQuote(draft);
    location.hash = "#/quotes/"+draftId;
    renderQuoteForm();
  });

  ["marineOpsRef","commercialRef","carrier","importExport","pol","pod","terminal","vesselService","stevedore","status","createdBy"].forEach(f=>{
    const el = document.getElementById("f_"+f);
    if (!el) return;
    el.addEventListener("input", ()=>{ draft[f]=el.value; if(f==="carrier") paintPricingPanel(); });
    el.addEventListener("change", ()=>{ draft[f]=el.value; if(f==="carrier") paintPricingPanel(); });
  });
  ["stHours","otHours"].forEach(f=>{});
  const bindNum=(id,field)=>{ const el=document.getElementById(id); el.addEventListener("input",()=>{ draft.pricing[field]=el.value; paintPricingPanel(); }); };
  bindNum("f_stHours","stHours"); bindNum("f_otHours","otHours"); bindNum("f_elSt","extraLaborStHours"); bindNum("f_elOt","extraLaborOtHours");
  const bindChk=(id,field)=>{ const el=document.getElementById(id); el.addEventListener("change",()=>{ draft.pricing[field]=el.checked; paintPricingPanel(); }); };
  bindChk("f_survey","surveyNeeded"); bindChk("f_rehandle","reHandleNeeded"); bindChk("f_notdirect","notDirectDischarge");
  document.getElementById("f_notes").addEventListener("input", (e)=> draft.notes = e.target.value);

  document.getElementById("addPieceBtn").addEventListener("click", ()=>{
    draft.pieces.push(blankPiece());
    renderPieces();
    paintDerived();
  });

  document.querySelectorAll(".tabstrip button[data-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      emailTab = btn.getAttribute("data-tab");
      document.querySelectorAll(".tabstrip button[data-tab]").forEach(b=>b.classList.toggle("active", b===btn));
      document.getElementById("intakePaste").hidden = emailTab!=="paste";
      document.getElementById("intakeUpload").hidden = emailTab!=="upload";
      document.getElementById("intakeManual").hidden = emailTab!=="manual";
    });
  });
  const pasteArea = document.getElementById("pasteArea");
  ["dragover","dragenter"].forEach(evt=> pasteArea.addEventListener(evt, e=>{ e.preventDefault(); pasteArea.style.borderColor = "var(--accent)"; }));
  ["dragleave","drop"].forEach(evt=> pasteArea.addEventListener(evt, e=>{ e.preventDefault(); pasteArea.style.borderColor = ""; }));
  pasteArea.addEventListener("drop", e=>{ if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0], false); });

  document.getElementById("parsePasteBtn").addEventListener("click", ()=>{
    const raw = document.getElementById("pasteArea").value;
    if (!raw.trim()) return;
    emailTab = "paste";
    applyParsedEmail(parseEmailText(raw), "the pasted email");
  });
  const fileInput = document.getElementById("fileInput");
  document.getElementById("browseBtn").addEventListener("click", ()=> fileInput.click());
  const dz = document.getElementById("dropzone");
  ["dragover","dragenter"].forEach(evt=> dz.addEventListener(evt, e=>{ e.preventDefault(); dz.classList.add("drag"); }));
  ["dragleave","drop"].forEach(evt=> dz.addEventListener(evt, e=>{ e.preventDefault(); dz.classList.remove("drag"); }));
  dz.addEventListener("drop", e=>{ if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener("change", ()=>{ if (fileInput.files[0]) handleFile(fileInput.files[0]); });
}

function setUploadStatus(msg, isError){
  const el = document.getElementById("uploadStatus");
  if (!el) return;
  el.textContent = msg;
  el.style.color = isError ? "var(--bad)" : "var(--good)";
}

function handleFile(file, switchToUploadTab){
  if (switchToUploadTab !== false) emailTab = "upload";
  setUploadStatus("Reading " + file.name + "…", false);
  const name = file.name.toLowerCase();
  const isMsg = name.endsWith(".msg");
  const reader = new FileReader();
  reader.onerror = ()=> setUploadStatus("Couldn't read " + file.name + " — try pasting the email text instead.", true);
  reader.onload = ()=>{
    try{
      const text = isMsg ? extractTextFromMsgBuffer(reader.result) : String(reader.result);
      applyParsedEmail(parseEmailText(text), file.name);
    }catch(e){
      setUploadStatus("Couldn't read " + file.name + " — try pasting the email text instead.", true);
    }
  };
  if (isMsg) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
}

function collectHeaderFields(){
  ["marineOpsRef","commercialRef","carrier","importExport","pol","pod","terminal","vesselService","stevedore","status","createdBy"].forEach(f=>{
    const el = document.getElementById("f_"+f); if (el) draft[f]=el.value;
  });
  draft.notes = document.getElementById("f_notes").value;
}

let pendingIntakeMessage = null;
function applyParsedEmail(parsed, sourceLabel){
  const headerCount = Object.keys(parsed.header).length;
  const pieceCount = parsed.pieces.length;
  Object.assign(draft, parsed.header);
  draft.carrier = parsed.carrier;
  if (parsed.pieces.length) draft.pieces = parsed.pieces;
  if (headerCount === 0 && pieceCount === 0){
    pendingIntakeMessage = { text: "Couldn't find any recognizable fields in " + sourceLabel + " — the form is unchanged. Try pasting the plain-text body instead, or fill it in manually.", error:true };
  } else {
    pendingIntakeMessage = { text: "Filled in " + headerCount + " header field" + (headerCount===1?"":"s") + " and " + pieceCount + " cargo piece" + (pieceCount===1?"":"s") + " from " + sourceLabel + ". Check every field below.", error:false };
  }
  renderQuoteForm();
}

/* ---------------------------------------------------------------------
   VIEW: SETTINGS / REFERENCE
--------------------------------------------------------------------- */
function renderSettings(){
  const main = document.getElementById("main");
  const cap = config.capability;
  main.innerHTML = `
    <div class="page-head"><div><h1>Reference &amp; <b>Rates</b></h1><p>Every number here backs a quote calculation. Anything flagged ⚠ came from source documents that disagreed with each other — fix it once here and every future quote uses the correct figure.</p></div></div>

    ${!cap.capabilityConfirmed ? '<div class="banner banner-warn">'+icon('exclamation-triangle','ic-lg')+'<div><b>Crane &amp; rigging reference data needs your sign-off.</b> '+esc(cap.capabilityNote)+'</div></div>' : ''}

    <div class="card card-pad" style="margin-bottom:18px;">
      <div class="section-title">${icon("crane")} Crane &amp; rigging capacity</div>
      <div class="grid grid-4">
        <div class="field"><label>Crane hook (bare), MT</label><input id="c_craneHookMt" type="number" value="${cap.craneHookMt}"></div>
        <div class="field"><label>Spreader, twin-lift MT</label><input id="c_spreaderTwin" type="number" value="${cap.craneSpreaderTwinMt}"></div>
        <div class="field"><label>Spreader, single-lift MT</label><input id="c_spreaderSingle" type="number" value="${cap.craneSpreaderSingleMt}"></div>
        <div class="field"><label>Tandem (2-crane) lifts</label><select id="c_tandem"><option value="no" ${!cap.tandemAllowed?"selected":""}>Not offered</option><option value="yes" ${cap.tandemAllowed?"selected":""}>Offered</option></select></div>
        <div class="field"><label>110-ton beam, US tons</label><input id="c_beam110" type="number" value="${cap.beam110UsTon}"></div>
        <div class="field"><label>60-ton beam, US tons</label><input id="c_beam60" type="number" value="${cap.beam60UsTon}"></div>
        <div class="field"><label>Shackle WLL, tonnes</label><input id="c_shackle" type="number" value="${cap.shackleTonne}"></div>
        <div class="field"><label>Twin-path sling, basket lbs</label><input id="c_slingBasket" type="number" value="${cap.slingBasketLbs}"></div>
        <div class="field"><label>Max length, athwartship (ft)</label><input id="c_lenAthwart" type="number" value="${cap.maxLengthAthwartshipFt}"></div>
        <div class="field"><label>Max length, along legs (ft)</label><input id="c_lenLegs" type="number" value="${cap.maxLengthAlongLegsFt}"></div>
        <div class="field"><label>Overhead-bar height threshold (ft)</label><input id="c_ohBar" type="number" value="${cap.ohBarHeightThresholdFt}"></div>
      </div>
      <div style="margin-top:14px; display:flex; align-items:center; gap:10px;">
        <label class="checkline"><input type="checkbox" id="c_confirmed" ${cap.capabilityConfirmed?"checked":""}> I've confirmed these numbers are current</label>
      </div>
      <div class="field" style="margin-top:10px;"><label>Notes / sources</label><textarea id="c_note" rows="2">${esc(cap.capabilityNote)}</textarea></div>
    </div>

    <div class="card card-pad" style="margin-bottom:18px;">
      <div class="section-title">Fees</div>
      <div class="wrap-table"><table class="rate-table">
        <thead><tr><th>Fee</th><th>Amount</th><th>Confirmed?</th><th>Why it's flagged</th></tr></thead>
        <tbody>
          ${["survey","reHandle","notDirectDischarge"].map(k=>{
            const f = config.fees[k];
            const label = {survey:"Surveyor fee", reHandle:"Re-handle fee", notDirectDischarge:"Not-direct-discharge surcharge"}[k];
            return '<tr><td>'+label+'</td><td><input data-fee="'+k+'" type="number" step="0.01" value="'+f.amount+'"></td>'
              + '<td><input type="checkbox" data-feeok="'+k+'" '+(f.confirmed?"checked":"")+'></td>'
              + '<td style="font-size:12px; color:var(--ink-muted); max-width:360px;">'+esc(f.note)+'</td></tr>';
          }).join("")}
        </tbody>
      </table></div>
    </div>

    <div class="card card-pad">
      <div class="section-title">Tariff rate</div>
      <p class="field-note" style="margin-top:-6px; margin-bottom:12px;">One universal tariff now applies to every quote, regardless of carrier.</p>
      <div class="wrap-table"><table class="rate-table">
        <thead><tr><th>ST rate</th><th>OT rate</th><th>Extra labor ST</th><th>Extra labor OT</th><th>OK?</th><th>Note</th></tr></thead>
        <tbody>
        ${(()=>{
          const r = config.rates.TARIFF;
          return '<tr>'
            + '<td><input data-rate="TARIFF:st" type="number" step="0.01" value="'+r.st+'"></td>'
            + '<td><input data-rate="TARIFF:ot" type="number" step="0.01" value="'+r.ot+'"></td>'
            + '<td><input data-rate="TARIFF:extraLaborSt" type="number" step="0.01" value="'+r.extraLaborSt+'"></td>'
            + '<td><input data-rate="TARIFF:extraLaborOt" type="number" step="0.01" value="'+r.extraLaborOt+'"></td>'
            + '<td><input type="checkbox" data-rateok="TARIFF" '+(r.confirmed?"checked":"")+'></td>'
            + '<td style="font-size:12px; color:var(--ink-muted); max-width:300px;">'+esc(r.note)+(r.confirmed?"":' <span class="flag">⚠ confirm</span>')+'</td></tr>';
        })()}
        </tbody>
      </table></div>
    </div>
    <div style="margin-top:20px; display:flex; justify-content:flex-end;">
      <button class="btn btn-primary" id="saveSettingsBtn">Save Reference Data</button>
    </div>
  `;

  document.getElementById("saveSettingsBtn").addEventListener("click", async ()=>{
    cap.craneHookMt = +document.getElementById("c_craneHookMt").value;
    cap.craneSpreaderTwinMt = +document.getElementById("c_spreaderTwin").value;
    cap.craneSpreaderSingleMt = +document.getElementById("c_spreaderSingle").value;
    cap.tandemAllowed = document.getElementById("c_tandem").value === "yes";
    cap.beam110UsTon = +document.getElementById("c_beam110").value;
    cap.beam60UsTon = +document.getElementById("c_beam60").value;
    cap.shackleTonne = +document.getElementById("c_shackle").value;
    cap.slingBasketLbs = +document.getElementById("c_slingBasket").value;
    cap.maxLengthAthwartshipFt = +document.getElementById("c_lenAthwart").value;
    cap.maxLengthAlongLegsFt = +document.getElementById("c_lenLegs").value;
    cap.ohBarHeightThresholdFt = +document.getElementById("c_ohBar").value;
    cap.capabilityConfirmed = document.getElementById("c_confirmed").checked;
    cap.capabilityNote = document.getElementById("c_note").value;

    document.querySelectorAll("[data-fee]").forEach(el=>{ config.fees[el.getAttribute("data-fee")].amount = +el.value; });
    document.querySelectorAll("[data-feeok]").forEach(el=>{ config.fees[el.getAttribute("data-feeok")].confirmed = el.checked; });
    document.querySelectorAll("[data-rate]").forEach(el=>{
      const [carrier,field] = el.getAttribute("data-rate").split(":");
      config.rates[carrier][field] = +el.value;
    });
    document.querySelectorAll("[data-rateok]").forEach(el=>{ config.rates[el.getAttribute("data-rateok")].confirmed = el.checked; });

    const btn = document.getElementById("saveSettingsBtn");
    btn.disabled = true; btn.textContent = "Saving…";
    await saveConfig();
    btn.disabled = false; btn.textContent = "Saved ✓";
    setTimeout(renderSettings, 700);
  });
}

boot();
})();
</script>
